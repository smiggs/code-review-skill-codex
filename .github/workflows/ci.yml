name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Test helper and structural validator
        run: python -B -m unittest discover -s tests -v
      - name: Validate skill structure and links
        run: python -B scripts/validate-skill.py
      - name: Check guide examples
        run: python -B plans/evidence/03-python-examples.py
      - name: Check severity diagnostic evidence
        run: |
          python -B plans/evidence/07-severity-diagnostic/check-fixtures.py
          python -B plans/evidence/07-severity-execution/test_live_baseline.py
          python -B plans/evidence/07-severity-execution/test_candidate_archive.py
          python -B plans/evidence/07-severity-execution/verify_candidate_archive.py
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  all-checks-passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [validate]
    if: always()
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
